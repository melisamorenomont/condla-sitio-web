project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - explorar.qmd
    - codebook.qmd
    - descargas.qmd
    - publicaciones.qmd
    - equipo.qmd
    # Nota: `descargas/` y `docs/` contienen .qmd que NO deben renderizarse
    # como páginas del sitio -- descargas/Script_publicable_CONDLA_v1.qmd es
    # un archivo para descargar tal cual (el script de replicación), y
    # docs/ tiene el plan de implementación. Un glob como "*.qmd" los
    # recoge igual y Quarto intenta ejecutarlos; por eso se listan los
    # archivos exactos acá en vez de un patrón.

website:
  title: "CONDLA"
  description: "Condicionalidades en Transferencias Monetarias Condicionadas en América Latina"
  # TODO al publicar: completar con la URL real de GitHub Pages (ver README.md,
  # sección "Cómo transferir este sitio a otra cuenta de GitHub").
  site-url: ""
  navbar:
    left:
      - href: index.qmd
        text: Inicio
      - href: explorar.qmd
        text: Explorar los datos
      - href: codebook.qmd
        text: Codebook y metodología
      - href: descargas.qmd
        text: Descargas y réplica
      - href: publicaciones.qmd
        text: Publicaciones
      - href: equipo.qmd
        text: Equipo
  page-footer:
    center: "Proyecto CONDLA — Condicionalidades en América Latina"

format:
  html:
    theme: [cosmo, styles/brand.scss]
    toc: false
    lang: es
    grid:
      body-width: 900px

lang: es
