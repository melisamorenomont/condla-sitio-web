project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - explorar.qmd
    - codebook.qmd
    - descargas.qmd
    - publicaciones.qmd
    - equipo.qmd
    - disclaimer.qmd
    # Nota: `descargas/` y `docs/` contienen .qmd que NO deben renderizarse
    # como páginas del sitio -- descargas/Script_publicable_CONDLA_v1.qmd es
    # un archivo para descargar tal cual (el script de replicación), y
    # docs/ tiene el plan de implementación. Un glob como "*.qmd" los
    # recoge igual y Quarto intenta ejecutarlos; por eso se listan los
    # archivos exactos acá en vez de un patrón.

website:
  title: "CONDLA"
  description: "Conditionalities in Latin America's Conditional Cash Transfer programs"
  site-url: "https://melisamorenomont.github.io/condla-sitio-web/"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: explorar.qmd
        text: Explore the Data
      - href: codebook.qmd
        text: Codebook & Methodology
      - href: descargas.qmd
        text: Downloads & Replication
      - href: publicaciones.qmd
        text: Publications
      - href: equipo.qmd
        text: Team
      - href: disclaimer.qmd
        text: Disclaimer
  page-footer:
    center: "CONDLA Project — Conditionalities in Latin America"

format:
  html:
    theme: [cosmo, styles/brand.scss]
    toc: false
    lang: en
    grid:
      body-width: 900px
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&display=swap" rel="stylesheet">

lang: en
